name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  calidad:
    name: calidad (formato · lint · tipos · unitarios)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Los tests de integración de los adaptadores Prisma solo se ejecutan si existe
    # TEST_DATABASE_URL (`describe.runIf`); sin la variable se saltan en silencio y el CI daría por
    # bueno un adaptador que nadie ejecutó (CIF-19). La base es efímera y no guarda datos reales.
    env:
      TEST_DATABASE_URL: postgresql://cifuentes@127.0.0.1:5432/cifuentes_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cifuentes
          POSTGRES_DB: cifuentes_test
          # Contenedor efímero del runner: escucha solo en localhost y no guarda ningún secreto.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cifuentes -d cifuentes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          # `scripts/docs-preview-guard.sh` compara la rama del PR con su base (merge-base), así que
          # necesita la historia completa y `origin/<base>`. Con el checkout superficial por defecto
          # la guardia no puede comparar y falla cerrada (CIF-155).
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: cliente de Prisma
        run: pnpm db:generate
      - run: pnpm format:check
      - name: Sintaxis de los scripts de operación
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: shellcheck de los scripts de operación
        run: shellcheck scripts/*.sh
      - name: Barrido de secretos (contrato de redacción, ADR-0014)
        run: ./scripts/secret-scan.sh
      - name: Test del contrato de redacción del barrido
        run: ./scripts/secret-scan.test.sh
      - name: Test del bootstrap de variables de Vercel (DATABASE_URL por entorno)
        run: ./scripts/vercel-bootstrap.test.sh
      - name: Test del paso de release (migraciones)
        run: ./scripts/release.test.sh
      - name: Avisos del preflight de despliegue (variables de Production, sesión e interruptores del panel, CIF-123/CIF-129/CIF-241/CIF-282)
        run: ./scripts/despliegue-preflight.test.sh
      - name: Test de la guardia de preview de las ramas docs/** (ADR-0019, CIF-155)
        run: ./scripts/docs-preview-guard.test.sh
      - name: Guardia de contenido de las ramas docs/** (sin preview de Vercel)
        run: ./scripts/docs-preview-guard.sh
      - name: Guarda y paso de siembra del catálogo de preview (CIF-330)
        run: ./scripts/seed-preview-catalogo.test.sh
      - name: Test del contrato HTTP real de /api/health (CIF-456)
        run: ./scripts/health-http-check.test.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - name: migraciones en la base de datos de test
        run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:deploy
      - run: pnpm test:coverage
      # La carrera de la entrega de presupuestos se fuerza dentro del test (CIF-406); esta repetición
      # deja evidencia de N pasadas consecutivas en verde del fichero de integración que destapó el
      # rojo intermitente de `repositories.test.ts:892`, sin esperar a que el scheduling lo repita.
      - name: Integración Prisma, 5 pasadas consecutivas (CIF-406)
        run: |
          for repetition in $(seq 1 5); do
            echo "· integración Prisma, repetición ${repetition}/5"
            pnpm exec vitest run src/infrastructure/persistence/prisma/repositories.test.ts
          done
      # El E2E hermético solo ve el estado `unconfigured` del borde (CIF-456). Este paso sirve la
      # build de producción con los cuatro entornos del contrato de `/api/health` (ADR-0015 §5)
      # sobre la base de test ya migrada: una regresión de los 503 no llega a `main` sin que esta
      # puerta la vea. Deja el informe como artefacto.
      - name: Contrato HTTP real de /api/health sobre la build de producción (CIF-456)
        env:
          HEALTH_CHECK_REPORT: salud-http.log
        run: ./scripts/health-http-check.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: salud-http
          path: salud-http.log
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  e2e:
    name: e2e (puerta obligatoria)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: cliente de Prisma
        run: pnpm db:generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
