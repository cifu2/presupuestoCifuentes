name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  calidad:
    name: calidad (formato · lint · tipos · unitarios)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Los tests de integración de los adaptadores Prisma solo se ejecutan si existe
    # TEST_DATABASE_URL (`describe.runIf`); sin la variable se saltan en silencio y el CI daría por
    # bueno un adaptador que nadie ejecutó (CIF-19). La base es efímera y no guarda datos reales.
    env:
      TEST_DATABASE_URL: postgresql://cifuentes@127.0.0.1:5432/cifuentes_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cifuentes
          POSTGRES_DB: cifuentes_test
          # Contenedor efímero del runner: escucha solo en localhost y no guarda ningún secreto.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cifuentes -d cifuentes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: cliente de Prisma
        run: pnpm db:generate
      - run: pnpm format:check
      - name: Sintaxis de los scripts de operación
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: shellcheck de los scripts de operación
        run: shellcheck scripts/*.sh
      - name: Barrido de secretos (contrato de redacción, ADR-0014)
        run: ./scripts/secret-scan.sh
      - name: Test del contrato de redacción del barrido
        run: ./scripts/secret-scan.test.sh
      - name: Guardia de la identidad de aprobación (ADR-0015)
        run: ./scripts/approval-guard.sh --static-only
      - name: Test de la guardia de la identidad de aprobación
        run: ./scripts/approval-guard.test.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - name: migraciones en la base de datos de test
        run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:deploy
      - run: pnpm test:coverage
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  e2e:
    name: e2e (puerta obligatoria)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: cliente de Prisma
        run: pnpm db:generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
