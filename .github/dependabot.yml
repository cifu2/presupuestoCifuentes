# Actualizaciones de dependencias que Dependabot abre contra `main`.
# El updater clona `main` y resuelve con su propio pnpm: los ajustes de pnpm que condicionan esa
# resolución se versionan en pnpm-workspace.yaml (ver docs/despliegue.md, apartado 7). Los PRs de
# dependencias pasan por la puerta requerida `calidad` + `e2e`, igual que cualquier otro cambio.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    # Dependabot aplica un cooldown de 3 días por defecto y lo traduce a `--config.minimumReleaseAge`
    # en el updater de pnpm; ese flag gana a `minimumReleaseAge` del repositorio y abortaba la
    # resolución cuando el lockfile tenía versiones más jóvenes que la ventana (CIF-29). Excluir todas
    # las dependencias deja la política en manos del repositorio: 0 días, igual que pnpm.
    cooldown:
      exclude: ['*']
    open-pull-requests-limit: 5
    groups:
      produccion:
        dependency-type: production
      desarrollo:
        dependency-type: development
    ignore:
      - dependency-name: eslint
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
